name: Build PhysioVertex Direct v4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify required app features
        shell: bash
        run: |
          set -e
          grep -F 'Create Profile / Register' v4/MainActivity.kt
          grep -F 'Update App' v4/MainActivity.kt
          grep -F 'Pending Registrations' v4/MainActivity.kt
      - name: Prepare Android project
        id: project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          test -n "$ZIP"
          rm -rf android-project && mkdir android-project
          unzip -o "$ZIP" -d android-project
          SETTINGS=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          test -n "$SETTINGS"
          P=$(dirname "$SETTINGS")
          echo "dir=$P" >> "$GITHUB_OUTPUT"
          MAIN=$(find "$P/app/src/main/java" -name MainActivity.kt | head -1)
          test -n "$MAIN"
          cp v4/MainActivity.kt "$MAIN"
          mkdir -p "$P/app/src/main/res/drawable"
          export LOGO_OUT="$P/app/src/main/res/drawable/physiovertex_logo.png"
          python3 - <<'PY'
          import os, urllib.request
          from pathlib import Path
          from urllib.parse import quote
          url='https://physiovertex.in/imgaes/'+quote('Screenshot 2025-11-30 at 5.42.01\u202fPM.png')
          out=Path(os.environ['LOGO_OUT']); urllib.request.urlretrieve(url,out)
          if out.stat().st_size < 1000: raise SystemExit('Logo download failed')
          PY
          MANIFEST="$P/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          import sys,re
          p=sys.argv[1]; s=open(p,encoding='utf-8').read()
          s=re.sub(r'android:label="[^"]*"','android:label="PhysioVertex"',s,1)
          if 'android:label=' not in s: s=s.replace('<application','<application android:label="PhysioVertex"',1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          cat >> "$P/app/build.gradle" <<'EOF'

          android {
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle assembleDebug --stacktrace --no-daemon
      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)
          test -n "$APK"
          cp "$APK" PhysioVertex-Latest.apk
          echo "file=PhysioVertex-Latest.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-APK-PHYSIO
          path: PhysioVertex-Latest.apk
      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest PhysioVertex-Latest.apk --title "PhysioVertex Latest APK" --notes "Latest PhysioVertex Android test build"
