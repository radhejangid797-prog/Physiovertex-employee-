name: Build PhysioVertex APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract project
        id: project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          rm -rf android-project && mkdir android-project
          unzip -o "$ZIP" -d android-project
          SETTINGS=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"
      - name: Configure v4
        shell: bash
        run: |
          set -e
          P="${{ steps.project.outputs.dir }}"
          cat >> "$P/app/build.gradle" <<'EOF'

          android {
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
          }
          EOF
          MAIN=$(find "$P/app/src/main/java" -name MainActivity.kt | head -1)
          sed -i 's/Attendance radius: 300 metres/Attendance radius: 50 metres/' "$MAIN" || true
          sed -i 's/PhysioVertex/PhysioVertex v4/' "$MAIN" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle assembleDebug --stacktrace --no-daemon
      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)
          test -n "$APK"
          echo "file=$APK" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-v4
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
