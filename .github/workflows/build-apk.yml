name: Build PhysioVertex Direct v4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android project
        id: project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          test -n "$ZIP"
          rm -rf android-project && mkdir android-project
          unzip -o "$ZIP" -d android-project
          SETTINGS=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          test -n "$SETTINGS"
          P=$(dirname "$SETTINGS")
          echo "dir=$P" >> "$GITHUB_OUTPUT"
          MAIN=$(find "$P/app/src/main/java" -name MainActivity.kt | head -1)
          test -n "$MAIN"
          cp v4/MainActivity.kt "$MAIN"

          mkdir -p "$P/app/src/main/res/drawable"
          export LOGO_OUT="$P/app/src/main/res/drawable/physiovertex_logo.png"
          python3 - <<'PY'
          import os, urllib.request
          from pathlib import Path
          from urllib.parse import quote
          url='https://physiovertex.in/imgaes/'+quote('Screenshot 2025-11-30 at 5.42.01\u202fPM.png')
          out=Path(os.environ['LOGO_OUT'])
          urllib.request.urlretrieve(url,out)
          if out.stat().st_size < 1000: raise SystemExit('Logo download failed')
          PY

          ICON_B64=''
          echo "$ICON_B64" | base64 -d > /tmp/icon.png
          for D in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$P/app/src/main/res/$D"
            cp /tmp/icon.png "$P/app/src/main/res/$D/ic_launcher.png"
            cp /tmp/icon.png "$P/app/src/main/res/$D/ic_launcher_round.png"
          done

          MANIFEST="$P/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          import sys,re
          p=sys.argv[1]; s=open(p,encoding='utf-8').read()
          s=re.sub(r'android:icon="[^"]*"','android:icon="@mipmap/ic_launcher"',s)
          if 'android:icon=' not in s: s=s.replace('<application','<application android:icon="@mipmap/ic_launcher"',1)
          s=re.sub(r'android:roundIcon="[^"]*"','android:roundIcon="@mipmap/ic_launcher_round"',s)
          if 'android:roundIcon=' not in s: s=s.replace('<application','<application android:roundIcon="@mipmap/ic_launcher_round"',1)
          s=re.sub(r'android:label="[^"]*"','android:label="PhysioVertex"',s,1)
          if 'android:label=' not in s: s=s.replace('<application','<application android:label="PhysioVertex"',1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -q 'android:label="PhysioVertex"' "$MANIFEST"
          grep -q 'Admin Dashboard' "$MAIN"
          grep -q 'Employee Records' "$MAIN"

          cat >> "$P/app/build.gradle" <<'EOF'

          android {
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle assembleDebug --stacktrace --no-daemon
      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)
          test -n "$APK"
          echo "file=$APK" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-APK
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
