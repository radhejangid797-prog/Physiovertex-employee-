name: Build PhysioVertex Direct v4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android project
        id: project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          test -n "$ZIP"
          rm -rf android-project && mkdir android-project
          unzip -o "$ZIP" -d android-project
          SETTINGS=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          test -n "$SETTINGS"
          P=$(dirname "$SETTINGS")
          echo "dir=$P" >> "$GITHUB_OUTPUT"
          MAIN=$(find "$P/app/src/main/java" -name MainActivity.kt | head -1)
          test -n "$MAIN"
          cp v4/MainActivity.kt "$MAIN"
          mkdir -p "$P/app/src/main/res/drawable"
          export LOGO_OUT="$P/app/src/main/res/drawable/physiovertex_logo.png"
          python3 - <<'PY'
          import os, urllib.request
          from pathlib import Path
          from urllib.parse import quote
          base = 'https://physiovertex.in/imgaes/'
          name = 'Screenshot 2025-11-30 at 5.42.01\u202fPM.png'
          url = base + quote(name)
          out = Path(os.environ['LOGO_OUT'])
          out.parent.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve(url, out)
          if out.stat().st_size < 1000:
              raise SystemExit('Logo download failed')
          print('Official PhysioVertex website logo downloaded:', out.stat().st_size, 'bytes')
          PY
          test -s "$LOGO_OUT"
          grep -q 'physiovertex_logo' "$MAIN"
          grep -q 'Admin Dashboard' "$MAIN"
          grep -q 'Check In with Selfie' "$MAIN"
          grep -q 'Attendance Overview' "$MAIN"
          cat >> "$P/app/build.gradle" <<'EOF'

          android {
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          EOF
          echo "OFFICIAL WEBSITE BRAND SOURCE VERIFIED"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Website Brand APK
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.dir }}"
          gradle assembleDebug --stacktrace --no-daemon
      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)
          test -n "$APK"
          echo "file=$APK" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-OFFICIAL-WEBSITE-BRAND
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
