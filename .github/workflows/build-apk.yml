name: Build PhysioVertex APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project ZIP
        id: zip
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          test -n "$ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf android-project
          mkdir -p android-project
          unzip -o "${{ steps.zip.outputs.zip_file }}" -d android-project

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -e
          SETTINGS_FILE=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Add admin and employee management
        shell: bash
        run: |
          set -e
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          APP_GRADLE="$PROJECT_DIR/app/build.gradle"
          cat >> "$APP_GRADLE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          MAIN=$(find "$PROJECT_DIR/app/src/main/java" -type f -name "MainActivity.kt" | head -n 1)
          test -n "$MAIN"
          cat > "$MAIN" <<'EOF'
          package com.physiovertex.app

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.graphics.Typeface
          import android.text.InputType
          import android.view.Gravity
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : Activity() {
              private val blue = Color.rgb(24, 92, 180)
              private val prefs by lazy { getSharedPreferences("physiovertex", MODE_PRIVATE) }
              private lateinit var root: LinearLayout
              private var currentEmployee = "PV001"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (!prefs.contains("emp_PV001_pass")) {
                      prefs.edit()
                          .putString("emp_PV001_name", "Employee 1")
                          .putString("emp_PV001_pass", "1234")
                          .putString("emp_PV001_salary", "0")
                          .apply()
                  }
                  showRoleScreen()
              }

              private fun base(): LinearLayout {
                  val scroll = ScrollView(this)
                  root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 56, 48, 56)
                      setBackgroundColor(Color.rgb(245, 249, 255))
                  }
                  scroll.addView(root)
                  setContentView(scroll)
                  return root
              }

              private fun title(text: String) = TextView(this).apply {
                  this.text = text
                  textSize = 28f
                  setTextColor(blue)
                  setTypeface(null, Typeface.BOLD)
                  gravity = Gravity.CENTER
                  setPadding(0, 20, 0, 28)
              }

              private fun label(text: String) = TextView(this).apply {
                  this.text = text
                  textSize = 17f
                  setTextColor(Color.DKGRAY)
                  setPadding(4, 14, 4, 8)
              }

              private fun edit(hintText: String, password: Boolean = false) = EditText(this).apply {
                  hint = hintText
                  if (password) inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
              }

              private fun button(text: String, action: () -> Unit) = Button(this).apply {
                  this.text = text
                  textSize = 17f
                  setTextColor(Color.WHITE)
                  setBackgroundColor(blue)
                  setPadding(12, 14, 12, 14)
                  setOnClickListener { action() }
              }

              private fun space() = Space(this).apply { layoutParams = LinearLayout.LayoutParams(1, 22) }

              private fun showRoleScreen() {
                  val v = base()
                  v.addView(title("PhysioVertex"))
                  v.addView(button("EMPLOYEE LOGIN") { showEmployeeLogin() })
                  v.addView(space())
                  v.addView(button("ADMIN LOGIN") { showAdminLogin() })
              }

              private fun showEmployeeLogin() {
                  val v = base()
                  v.addView(title("Employee Login"))
                  val id = edit("Employee ID")
                  val pass = edit("Password", true)
                  v.addView(id); v.addView(pass)
                  v.addView(button("LOGIN") {
                      val empId = id.text.toString().trim().uppercase(Locale.getDefault())
                      val saved = prefs.getString("emp_${empId}_pass", null)
                      if (saved != null && saved == pass.text.toString()) {
                          currentEmployee = empId
                          showEmployeeDashboard()
                      } else Toast.makeText(this, "Invalid Employee ID or Password", Toast.LENGTH_SHORT).show()
                  })
                  v.addView(space()); v.addView(button("BACK") { showRoleScreen() })
              }

              private fun showAdminLogin() {
                  val v = base()
                  v.addView(title("Admin Login"))
                  val id = edit("Admin ID")
                  val pass = edit("Password", true)
                  v.addView(id); v.addView(pass)
                  v.addView(label("Default: ADMIN / 2468"))
                  v.addView(button("LOGIN") {
                      if (id.text.toString().trim().equals("ADMIN", true) && pass.text.toString() == "2468") showAdminDashboard()
                      else Toast.makeText(this, "Invalid Admin Login", Toast.LENGTH_SHORT).show()
                  })
                  v.addView(space()); v.addView(button("BACK") { showRoleScreen() })
              }

              private fun showAdminDashboard() {
                  val v = base()
                  v.addView(title("Admin Dashboard"))
                  v.addView(button("ADD / UPDATE EMPLOYEE") { showEmployeeEditor() })
                  v.addView(space())
                  v.addView(button("EMPLOYEE LIST") { showEmployeeList() })
                  v.addView(space())
                  v.addView(button("ATTENDANCE OVERVIEW") { showAdminAttendance() })
                  v.addView(space())
                  v.addView(button("LOGOUT") { showRoleScreen() })
              }

              private fun showEmployeeEditor() {
                  val v = base(); v.addView(title("Add / Update Employee"))
                  val id = edit("Employee ID e.g. PV002")
                  val name = edit("Employee Name")
                  val pass = edit("Password", true)
                  val salary = edit("Monthly Salary")
                  salary.inputType = InputType.TYPE_CLASS_NUMBER
                  v.addView(id); v.addView(name); v.addView(pass); v.addView(salary)
                  v.addView(button("SAVE EMPLOYEE") {
                      val empId = id.text.toString().trim().uppercase(Locale.getDefault())
                      if (empId.isBlank() || name.text.toString().isBlank() || pass.text.toString().isBlank()) {
                          Toast.makeText(this, "ID, Name and Password required", Toast.LENGTH_SHORT).show()
                      } else {
                          prefs.edit()
                              .putString("emp_${empId}_name", name.text.toString().trim())
                              .putString("emp_${empId}_pass", pass.text.toString())
                              .putString("emp_${empId}_salary", salary.text.toString().ifBlank { "0" })
                              .apply()
                          Toast.makeText(this, "Employee saved", Toast.LENGTH_SHORT).show()
                          showAdminDashboard()
                      }
                  })
                  v.addView(space()); v.addView(button("BACK") { showAdminDashboard() })
              }

              private fun employeeIds(): List<String> {
                  return prefs.all.keys
                      .filter { it.startsWith("emp_") && it.endsWith("_pass") }
                      .map { it.removePrefix("emp_").removeSuffix("_pass") }
                      .distinct().sorted()
              }

              private fun showEmployeeList() {
                  val v = base(); v.addView(title("Employee List"))
                  employeeIds().forEach { id ->
                      val name = prefs.getString("emp_${id}_name", "")
                      val salary = prefs.getString("emp_${id}_salary", "0")
                      v.addView(label("$id - $name\nSalary: ₹$salary"))
                  }
                  v.addView(space()); v.addView(button("BACK") { showAdminDashboard() })
              }

              private fun showEmployeeDashboard() {
                  val v = base()
                  val name = prefs.getString("emp_${currentEmployee}_name", currentEmployee)
                  v.addView(title("Employee Dashboard"))
                  v.addView(label("$name ($currentEmployee)"))
                  v.addView(label("Attendance radius: 300 metres"))
                  val status = label("")
                  fun refresh() {
                      val date = SimpleDateFormat("yyyy-MM-dd", Locale.getDefault()).format(Date())
                      val i = prefs.getString("in_${currentEmployee}_$date", null)
                      val o = prefs.getString("out_${currentEmployee}_$date", null)
                      status.text = "Today\nIN: ${i ?: "Not marked"}\nOUT: ${o ?: "Not marked"}"
                  }
                  v.addView(status); refresh()
                  v.addView(button("CHECK IN") {
                      val date = SimpleDateFormat("yyyy-MM-dd", Locale.getDefault()).format(Date())
                      val time = SimpleDateFormat("hh:mm a", Locale.getDefault()).format(Date())
                      prefs.edit().putString("in_${currentEmployee}_$date", time).apply(); refresh()
                  })
                  v.addView(space())
                  v.addView(button("CHECK OUT") {
                      val date = SimpleDateFormat("yyyy-MM-dd", Locale.getDefault()).format(Date())
                      val time = SimpleDateFormat("hh:mm a", Locale.getDefault()).format(Date())
                      prefs.edit().putString("out_${currentEmployee}_$date", time).apply(); refresh()
                  })
                  v.addView(space()); v.addView(button("ATTENDANCE HISTORY") { showEmployeeHistory() })
                  v.addView(space()); v.addView(button("SALARY DETAILS") { showSalary() })
                  v.addView(space()); v.addView(button("LOGOUT") { showRoleScreen() })
              }

              private fun showEmployeeHistory() {
                  val v = base(); v.addView(title("Attendance History"))
                  val df = SimpleDateFormat("yyyy-MM-dd", Locale.getDefault())
                  val display = SimpleDateFormat("dd MMM yyyy", Locale.getDefault())
                  val cal = Calendar.getInstance()
                  repeat(30) {
                      val key = df.format(cal.time)
                      val i = prefs.getString("in_${currentEmployee}_$key", null)
                      val o = prefs.getString("out_${currentEmployee}_$key", null)
                      if (i != null || o != null) v.addView(label("${display.format(cal.time)}\nIN: ${i ?: "-"}   OUT: ${o ?: "-"}"))
                      cal.add(Calendar.DAY_OF_YEAR, -1)
                  }
                  v.addView(space()); v.addView(button("BACK") { showEmployeeDashboard() })
              }

              private fun showSalary() {
                  val v = base(); v.addView(title("Salary Details"))
                  val salary = prefs.getString("emp_${currentEmployee}_salary", "0")
                  v.addView(label("Employee: $currentEmployee"))
                  v.addView(label("Monthly Salary: ₹$salary"))
                  v.addView(space()); v.addView(button("BACK") { showEmployeeDashboard() })
              }

              private fun showAdminAttendance() {
                  val v = base(); v.addView(title("Attendance Overview"))
                  val date = SimpleDateFormat("yyyy-MM-dd", Locale.getDefault()).format(Date())
                  employeeIds().forEach { id ->
                      val name = prefs.getString("emp_${id}_name", "")
                      val i = prefs.getString("in_${id}_$date", null)
                      val o = prefs.getString("out_${id}_$date", null)
                      v.addView(label("$id - $name\nIN: ${i ?: "-"}   OUT: ${o ?: "-"}"))
                  }
                  v.addView(space()); v.addView(button("BACK") { showAdminDashboard() })
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.project_dir }}"
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e
          APK_FILE=$(find "${{ steps.project.outputs.project_dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          test -n "$APK_FILE"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-Admin-v3
          path: ${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error
