name: Build PhysioVertex Direct v4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare SalaryBox-style PhysioVertex source
        id: project
        shell: bash
        run: |
          set -e
          ZIP=PhysioVertex_Final_Android_Project.zip
          rm -rf android-project && mkdir android-project
          unzip -o "$ZIP" -d android-project
          SETTINGS=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          test -n "$SETTINGS"
          P=$(dirname "$SETTINGS")
          echo "dir=$P" >> "$GITHUB_OUTPUT"

          find "$P/app/src" -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) -print -delete
          mkdir -p "$P/app/src/main/java/com/physiovertex/app"
          MAIN="$P/app/src/main/java/com/physiovertex/app/MainActivity.kt"
          cp v4/MainActivity.kt "$MAIN"

          python3 scripts/build56_patch.py "$MAIN"
          python3 scripts/salarybox_ui_patch.py "$MAIN"
          python3 scripts/nav_labels_patch.py "$MAIN"
          python3 scripts/reference_features_patch.py "$MAIN"

          COUNT=$(find "$P/app/src" -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) | wc -l)
          echo "MainActivity source count: $COUNT"
          test "$COUNT" -eq 1
          grep -F 'Physio Approved • Build 56' "$MAIN"
          grep -F 'Payroll Management' "$MAIN"
          grep -F 'Payable Salary' "$MAIN"
          grep -F 'PhysioVertex • Home' "$MAIN"
          grep -F 'Attendance Calendar' "$MAIN"
          grep -F '"HOME","HOME"' "$MAIN"
          grep -F '"PROFILE","PROFILE"' "$MAIN"
          grep -F 'Save Note' "$MAIN"
          grep -F 'Clinic Holidays' "$MAIN"
          grep -F 'My Documents' "$MAIN"
          ! grep -F 'Activated: $id' "$MAIN"

          mkdir -p "$P/app/src/main/res/drawable"
          export LOGO_OUT="$P/app/src/main/res/drawable/physiovertex_logo.png"
          python3 - <<'PY'
          import os, urllib.request
          from pathlib import Path
          from urllib.parse import quote
          url='https://physiovertex.in/imgaes/'+quote('Screenshot 2025-11-30 at 5.42.01\u202fPM.png')
          out=Path(os.environ['LOGO_OUT']); urllib.request.urlretrieve(url,out)
          if out.stat().st_size < 1000: raise SystemExit('Logo download failed')
          PY

          MANIFEST="$P/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          import sys,re
          p=sys.argv[1]; s=open(p,encoding='utf-8').read()
          s=re.sub(r'android:label="[^"]*"','android:label="PhysioVertex"',s,1)
          if 'android:label=' not in s: s=s.replace('<application','<application android:label="PhysioVertex"',1)
          open(p,'w',encoding='utf-8').write(s)
          PY

          cat >> "$P/app/build.gradle" <<'EOF'

          android {
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          EOF

      - name: Clean and build APK
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.dir }}"
          rm -rf app/build build .gradle
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)
          test -n "$APK"
          cp "$APK" PhysioVertex-Latest.apk
          ls -lh PhysioVertex-Latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-APK-PHYSIO
          path: PhysioVertex-Latest.apk

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest PhysioVertex-Latest.apk --title "PhysioVertex SalaryBox Style" --notes "Added Notes, Holiday List and Documents shortcuts with fixed bottom navigation"
