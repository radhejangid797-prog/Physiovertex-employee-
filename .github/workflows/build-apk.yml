name: Build PhysioVertex APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project ZIP
        id: zip
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf android-project
          mkdir -p android-project
          unzip -o "${{ steps.zip.outputs.zip_file }}" -d android-project

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -e
          SETTINGS_FILE=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Kotlin target with project Java target
        shell: bash
        run: |
          set -e
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cat > "$PROJECT_DIR/jvm-fix.gradle" <<'EOF'
          allprojects {
              tasks.configureEach { task ->
                  if (task.class.name == "org.jetbrains.kotlin.gradle.tasks.KotlinCompile") {
                      task.kotlinOptions.jvmTarget = "1.8"
                  }
              }
          }
          EOF

          echo "Using JVM compatibility patch:"
          cat "$PROJECT_DIR/jvm-fix.gradle"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.project_dir }}"
          java -version
          gradle --version
          gradle -I jvm-fix.gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e
          APK_FILE=$(find "${{ steps.project.outputs.project_dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found"
            find "${{ steps.project.outputs.project_dir }}" -type f -name "*.apk" -print
            exit 1
          fi
          echo "APK found: $APK_FILE"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-Debug-APK
          path: ${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error

      - name: Build Summary
        if: success()
        run: |
          echo "======================================"
          echo "PhysioVertex APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK: ${{ steps.apk.outputs.apk_file }}"
