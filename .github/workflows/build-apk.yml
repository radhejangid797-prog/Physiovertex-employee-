name: Build PhysioVertex Direct v4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare canonical Build 56 source
        id: project
        shell: bash
        run: |
          set -e
          ZIP=PhysioVertex_Final_Android_Project.zip
          rm -rf android-project && mkdir android-project
          unzip -o "$ZIP" -d android-project
          SETTINGS=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          test -n "$SETTINGS"
          P=$(dirname "$SETTINGS")
          echo "dir=$P" >> "$GITHUB_OUTPUT"

          find "$P/app/src" -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) -print -delete
          mkdir -p "$P/app/src/main/java/com/physiovertex/app"
          MAIN="$P/app/src/main/java/com/physiovertex/app/MainActivity.kt"
          cp v4/MainActivity.kt "$MAIN"

          python3 - "$MAIN" <<'PY'
          import sys
          p=sys.argv[1]
          s=open(p,encoding='utf-8').read()
          s=s.replace('try{startActivity(Intent(Intent.ACTION_VIEW,Uri.parse("https://github.com/radhejangid797-prog/Physiovertex-employee-/releases/download/latest/PhysioVertex-Latest.apk"))}', 'try{startActivity(Intent(Intent.ACTION_VIEW,Uri.parse("https://github.com/radhejangid797-prog/Physiovertex-employee-/releases/download/latest/PhysioVertex-Latest.apk")))}')
          s=s.replace('AlertDialog.Builder(this)', 'android.app.AlertDialog.Builder(this)')
          s=s.replace('brand(v,"Physio Registrations")', 'brand(v,"Physio Registrations • Build 56")')
          s=s.replace('.setTitle("Physio Approved")', '.setTitle("Physio Approved • Build 56")')

          admin_anchor='v.addView(menu("Leave Requests","Review pending physio requests"){adminLeaves()});v.addView(sp(20))'
          admin_new='v.addView(menu("Leave Requests","Review pending physio requests"){adminLeaves()});v.addView(sp(12))\n        v.addView(menu("Payroll Management","Set monthly salary, bonus and deduction"){payrollAdmin()});v.addView(sp(20))'
          if admin_anchor not in s: raise SystemExit('Admin dashboard anchor missing')
          s=s.replace(admin_anchor, admin_new, 1)

          old='private fun salary(){val v=base();brand(v,"Physio Payroll");v.addView(title("Salary Details"));v.addView(label("Physio: ${prefs.getString("emp_${currentEmployee}_name",currentEmployee)}\\nID: $currentEmployee\\nMonthly Salary: ₹${prefs.getString("emp_${currentEmployee}_salary","0")}"));v.addView(sp());v.addView(backBtn{empDash()})}'
          new='''private fun monthKey()=SimpleDateFormat("yyyy-MM",Locale.getDefault()).format(Date())
    private fun monthAttendanceDays(id:String):Int{val m=monthKey();return prefs.all.keys.count{it.startsWith("in_${id}_${m}-")}}
    private fun payrollAdmin(){
        val v=base();brand(v,"Payroll Management");v.addView(title("Monthly Payroll"))
        if(ids().isEmpty())v.addView(label("No active physios"))
        ids().forEach{id->
            val name=prefs.getString("emp_${id}_name",id)?:id
            val base=prefs.getString("emp_${id}_salary","0")?:"0"
            val x=(prefs.getString("payroll_${id}_${monthKey()}","")?:"").split("|")
            val bonus=x.getOrElse(0){"0"};val deduction=x.getOrElse(1){"0"}
            val payable=(base.toLongOrNull()?:0L)+(bonus.toLongOrNull()?:0L)-(deduction.toLongOrNull()?:0L)
            v.addView(menu("$id • $name","Base ₹$base • Payable ₹${payable.coerceAtLeast(0)}"){payrollEdit(id)});v.addView(sp(10))
        }
        v.addView(backBtn{adminDash()})
    }
    private fun payrollEdit(id:String){
        val v=base();brand(v,"Payroll Setup");val name=prefs.getString("emp_${id}_name",id)?:id;v.addView(title(name))
        val base=edit("Monthly Salary");base.inputType=InputType.TYPE_CLASS_NUMBER;base.setText(prefs.getString("emp_${id}_salary","0"))
        val x=(prefs.getString("payroll_${id}_${monthKey()}","")?:"").split("|")
        val bonus=edit("Bonus / Incentive");bonus.inputType=InputType.TYPE_CLASS_NUMBER;bonus.setText(x.getOrElse(0){"0"})
        val deduction=edit("Deduction");deduction.inputType=InputType.TYPE_CLASS_NUMBER;deduction.setText(x.getOrElse(1){"0"})
        v.addView(label("Month: ${monthKey()}\\nAttendance marked: ${monthAttendanceDays(id)} days\\nAttendance is for reference only; admin decides payroll amounts."));v.addView(sp(12))
        v.addView(base);v.addView(bonus);v.addView(deduction);v.addView(sp(12))
        v.addView(btn("Save Payroll"){
            val b=base.text.toString().toLongOrNull()?:0L;val bo=bonus.text.toString().toLongOrNull()?:0L;val de=deduction.text.toString().toLongOrNull()?:0L
            prefs.edit().putString("emp_${id}_salary",b.toString()).putString("payroll_${id}_${monthKey()}","$bo|$de").putString("salaryhist_${id}_${System.currentTimeMillis()}","${today()}|$b").apply()
            Toast.makeText(this,"Payroll saved",Toast.LENGTH_SHORT).show();payrollAdmin()
        });v.addView(sp());v.addView(backBtn{payrollAdmin()})
    }
    private fun salary(){
        val v=base();brand(v,"Physio Payroll");v.addView(title("Salary Details"))
        val base=(prefs.getString("emp_${currentEmployee}_salary","0")?:"0").toLongOrNull()?:0L
        val x=(prefs.getString("payroll_${currentEmployee}_${monthKey()}","")?:"").split("|")
        val bonus=x.getOrElse(0){"0"}.toLongOrNull()?:0L;val deduction=x.getOrElse(1){"0"}.toLongOrNull()?:0L
        val payable=(base+bonus-deduction).coerceAtLeast(0)
        v.addView(label("Physio: ${prefs.getString("emp_${currentEmployee}_name",currentEmployee)}\\nID: $currentEmployee\\nMonth: ${monthKey()}\\n\\nMonthly Salary: ₹$base\\nBonus / Incentive: ₹$bonus\\nDeduction: ₹$deduction\\n--------------------\\nPayable Salary: ₹$payable\\n\\nAttendance marked: ${monthAttendanceDays(currentEmployee)} days"))
        v.addView(sp());v.addView(backBtn{empDash()})
    }'''
          if old not in s: raise SystemExit('Old salary function not found')
          s=s.replace(old,new,1)

          if 'Activated: $id' in s: raise SystemExit('old approval toast in canonical source')
          for token in ['Physio Approved • Build 56','Payroll Management','Payable Salary','private fun payrollEdit']:
              if token not in s: raise SystemExit('Missing '+token)
          open(p,'w',encoding='utf-8').write(s)
          PY

          COUNT=$(find "$P/app/src" -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) | wc -l)
          test "$COUNT" -eq 1
          grep -F 'Physio Approved • Build 56' "$MAIN"
          grep -F 'Payroll Management' "$MAIN"
          grep -F 'Payable Salary' "$MAIN"
          ! grep -F 'Activated: $id' "$MAIN"

          mkdir -p "$P/app/src/main/res/drawable"
          export LOGO_OUT="$P/app/src/main/res/drawable/physiovertex_logo.png"
          python3 - <<'PY'
          import os, urllib.request
          from pathlib import Path
          from urllib.parse import quote
          url='https://physiovertex.in/imgaes/'+quote('Screenshot 2025-11-30 at 5.42.01\u202fPM.png')
          out=Path(os.environ['LOGO_OUT']); urllib.request.urlretrieve(url,out)
          if out.stat().st_size < 1000: raise SystemExit('Logo download failed')
          PY

          MANIFEST="$P/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          import sys,re
          p=sys.argv[1]; s=open(p,encoding='utf-8').read()
          s=re.sub(r'android:label="[^"]*"','android:label="PhysioVertex"',s,1)
          if 'android:label=' not in s: s=s.replace('<application','<application android:label="PhysioVertex"',1)
          open(p,'w',encoding='utf-8').write(s)
          PY

          cat >> "$P/app/build.gradle" <<'EOF'

          android {
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          EOF

      - name: Clean and build APK
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.dir }}"
          rm -rf app/build build .gradle
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)
          test -n "$APK"
          cp "$APK" PhysioVertex-Latest.apk
          ls -lh PhysioVertex-Latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-APK-PHYSIO
          path: PhysioVertex-Latest.apk

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest PhysioVertex-Latest.apk --title "PhysioVertex Build 56" --notes "Payroll management build 56"
