name: Build PhysioVertex APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract project
        id: project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          rm -rf android-project && mkdir android-project
          unzip -o "$ZIP" -d android-project
          SETTINGS=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"
      - name: Configure v4 features
        shell: bash
        run: |
          set -e
          P="${{ steps.project.outputs.dir }}"
          cat >> "$P/app/build.gradle" <<'EOF'

          android {
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
          }
          EOF
          MAIN=$(find "$P/app/src/main/java" -name MainActivity.kt | head -1)
          curl -fsSL "https://raw.githubusercontent.com/radhejangid797-prog/Physiovertex-employee-/6c54651cfde4823526088d4b2b9ec16578f01619/.github/workflows/build-apk.yml" > /tmp/v3.yml
          python3 - "$MAIN" <<'PY'
          import re, sys
          text=open('/tmp/v3.yml').read()
          m=re.search(r'cat > "\$MAIN" <<\x27EOF\x27\n(.*?)\n          EOF\n', text, re.S)
          if not m: raise SystemExit('v3 source not found')
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in m.group(1).splitlines())
          code=code.replace('Attendance radius: 300 metres','Attendance radius: 50 metres')
          code=code.replace('v.addView(title("Admin Dashboard"))','v.addView(title("Admin Dashboard v4"))\n        v.addView(button("MY EMPLOYEE DASHBOARD") { currentEmployee = "PV001"; showEmployeeDashboard() })\n        v.addView(space())')
          old='''if (empId.isBlank() || name.text.toString().isBlank() || pass.text.toString().isBlank()) {
                    Toast.makeText(this, "ID, Name and Password required", Toast.LENGTH_SHORT).show()
                } else {'''
          new='''if (empId.isBlank() || name.text.toString().isBlank() || pass.text.toString().isBlank()) {
                    Toast.makeText(this, "ID, Name and Password required", Toast.LENGTH_SHORT).show()
                } else if (!prefs.contains("emp_${empId}_pass") && employeeIds().size >= 10) {
                    Toast.makeText(this, "Maximum 10 employees allowed", Toast.LENGTH_SHORT).show()
                } else {'''
          code=code.replace(old,new)
          code=code.replace('prefs.edit().putString("in_${currentEmployee}_$date", time).apply(); refresh()','prefs.edit().putString("in_${currentEmployee}_$date", time).putLong("inms_${currentEmployee}_$date", System.currentTimeMillis()).apply(); refresh()')
          code=code.replace('prefs.edit().putString("out_${currentEmployee}_$date", time).apply(); refresh()','prefs.edit().putString("out_${currentEmployee}_$date", time).putLong("outms_${currentEmployee}_$date", System.currentTimeMillis()).apply(); refresh()')
          code=code.replace('status.text = "Today\\nIN: ${i ?: "Not marked"}\\nOUT: ${o ?: "Not marked"}"','''val ims = prefs.getLong("inms_${currentEmployee}_$date", 0L)
                val oms = prefs.getLong("outms_${currentEmployee}_$date", 0L)
                val worked = if (ims > 0 && oms >= ims) { val mins=(oms-ims)/60000; "${mins/60}h ${mins%60}m" } else "-"
                status.text = "Today\\nIN: ${i ?: "Not marked"}\\nOUT: ${o ?: "Not marked"}\\nWORKED: $worked"''')
          open(sys.argv[1],'w').write(code+'\n')
          PY
          grep -q 'Admin Dashboard v4' "$MAIN"
          grep -q 'MY EMPLOYEE DASHBOARD' "$MAIN"
          grep -q 'Attendance radius: 50 metres' "$MAIN"
          echo 'V4 PATCH VERIFIED'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle assembleDebug --stacktrace --no-daemon
      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)
          test -n "$APK"
          echo "file=$APK" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-v4-VERIFIED
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
