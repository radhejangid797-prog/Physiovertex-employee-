name: Build PhysioVertex APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 4 -type f | sort

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find android-project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find android-project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Project directory:"
          pwd

          echo ""
          echo "Java version:"
          java -version

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix JVM target compatibility
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          APP_GRADLE_KTS="app/build.gradle.kts"
          APP_GRADLE="app/build.gradle"

          if [ -f "$APP_GRADLE_KTS" ]; then
            echo "Found $APP_GRADLE_KTS"

            if grep -q "sourceCompatibility = JavaVersion.VERSION_1_8" "$APP_GRADLE_KTS"; then
              sed -i 's/sourceCompatibility = JavaVersion.VERSION_1_8/sourceCompatibility = JavaVersion.VERSION_17/g' "$APP_GRADLE_KTS"
            fi

            if grep -q "targetCompatibility = JavaVersion.VERSION_1_8" "$APP_GRADLE_KTS"; then
              sed -i 's/targetCompatibility = JavaVersion.VERSION_1_8/targetCompatibility = JavaVersion.VERSION_17/g' "$APP_GRADLE_KTS"
            fi

            if grep -q 'jvmTarget = "1.8"' "$APP_GRADLE_KTS"; then
              sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$APP_GRADLE_KTS"
            fi

            if ! grep -q "sourceCompatibility = JavaVersion.VERSION_17" "$APP_GRADLE_KTS"; then
              sed -i '/android {/a\
    compileOptions {\
        sourceCompatibility = JavaVersion.VERSION_17\
        targetCompatibility = JavaVersion.VERSION_17\
    }\
\
    kotlinOptions {\
        jvmTarget = "17"\
    }' "$APP_GRADLE_KTS"
            fi

          elif [ -f "$APP_GRADLE" ]; then
            echo "Found $APP_GRADLE"

            if grep -q "sourceCompatibility JavaVersion.VERSION_1_8" "$APP_GRADLE"; then
              sed -i 's/sourceCompatibility JavaVersion.VERSION_1_8/sourceCompatibility JavaVersion.VERSION_17/g' "$APP_GRADLE"
            fi

            if grep -q "targetCompatibility JavaVersion.VERSION_1_8" "$APP_GRADLE"; then
              sed -i 's/targetCompatibility JavaVersion.VERSION_1_8/targetCompatibility JavaVersion.VERSION_17/g' "$APP_GRADLE"
            fi

            if grep -q "jvmTarget = '1.8'" "$APP_GRADLE"; then
              sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" "$APP_GRADLE"
            fi

            if grep -q 'jvmTarget = "1.8"' "$APP_GRADLE"; then
              sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$APP_GRADLE"
            fi

            if ! grep -q "sourceCompatibility JavaVersion.VERSION_17" "$APP_GRADLE"; then
              sed -i '/android {/a\
    compileOptions {\
        sourceCompatibility JavaVersion.VERSION_17\
        targetCompatibility JavaVersion.VERSION_17\
    }\
\
    kotlinOptions {\
        jvmTarget = "17"\
    }' "$APP_GRADLE"
            fi

          else
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo ""
          echo "Gradle configuration after JVM fix:"
          cat app/build.gradle.kts 2>/dev/null || cat app/build.gradle

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          gradle --version

          gradle assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found"

            find "${{ steps.project.outputs.project_dir }}" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-Debug-APK
          path: ${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error

      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "======================================"
          echo "PhysioVertex APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK: ${{ steps.apk.outputs.apk_file }}"
