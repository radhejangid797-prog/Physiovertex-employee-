name: Build PhysioVertex APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="PhysioVertex_Final_Android_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf android-project
          mkdir -p android-project

          unzip -o "$ZIP_FILE" -d android-project

          echo "Extracted project:"
          find android-project -maxdepth 4 -type f | sort

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find android-project -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find android-project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: root build.gradle/build.gradle.kts not found"
            exit 1
          fi

      - name: Configure JVM 17
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/jvm17.gradle" <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile
          import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release.set(17)
              }

              tasks.withType(KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
          }
          EOF

          echo "JVM 17 configuration created."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            --init-script "$PROJECT_DIR/jvm17.gradle" \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f | grep -E '\.apk$' || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Build complete
        run: |
          echo "======================================"
          echo " PhysioVertex APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK: $APK_PATH"
