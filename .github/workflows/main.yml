name: Build PhysioVertex APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -o PhysioVertex_Final_Android_Project.zip -d android-project

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."
          find android-project -type f \( \
            -name "gradlew" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print

      - name: Locate project directory
        id: project
        run: |
          PROJECT_DIR=$(find android-project -type f -name "gradlew" -printf '%h\n' | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found in ZIP"
            echo "ZIP contents:"
            unzip -l PhysioVertex_Final_Android_Project.zip
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x "${{ steps.project.outputs.PROJECT_DIR }}/gradlew"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find "${{ steps.project.outputs.PROJECT_DIR }}" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
