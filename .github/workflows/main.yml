name: Build PhysioVertex APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -o PhysioVertex_Final_Android_Project.zip -d android-project

      - name: Check Android project
        run: |
          echo "Project files:"
          find android-project -maxdepth 3 -type f | sort

      - name: Build Debug APK
        working-directory: android-project
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-debug-apk
          path: android-project/**/build/outputs/apk/**/*.apk
