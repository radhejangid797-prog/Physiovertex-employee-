name: Build PhysioVertex APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check ZIP
        run: |
          ls -lah
          unzip -t PhysioVertex_Final_Android_Project.zip

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q PhysioVertex_Final_Android_Project.zip -d android-project
          echo "Extracted files:"
          find android-project -maxdepth 4 -type f | head -100

      - name: Find Android project
        id: project
        run: |
          PROJECT_DIR=$(find android-project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "ERROR: gradlew not found"
            exit 1
          fi

      - name: Find APK
        run: |
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-Debug-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
