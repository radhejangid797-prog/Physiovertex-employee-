name: Build PhysioVertex APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p android_project

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android ZIP file not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d android_project

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle project..."

          PROJECT_DIR=$(find android_project -type f -name "settings.gradle*" -o -type f -name "build.gradle*" | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Fix Kotlin JVM target
        shell: bash
        run: |
          set -e

          echo "Fixing Kotlin JVM target to 1.8..."

          find "$PROJECT_DIR" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print

          # For Groovy Gradle files
          find "$PROJECT_DIR" -type f -name "build.gradle" -exec sed -i \
            "/android[[:space:]]*{/a\\
          \\    compileOptions {\\
          \\        sourceCompatibility JavaVersion.VERSION_1_8\\
          \\        targetCompatibility JavaVersion.VERSION_1_8\\
          \\    }" {} \;

          # Add Kotlin JVM target to Kotlin projects if kotlinOptions is not already present
          find "$PROJECT_DIR" -type f -name "build.gradle" -exec sh -c '
            for file do
              if grep -q "org.jetbrains.kotlin" "$file" || grep -q "kotlinOptions" "$file"; then
                if ! grep -q "jvmTarget.*1.8" "$file"; then
                  cat >> "$file" <<'"'"'EOF'"'"'

kotlinOptions {
    jvmTarget = "1.8"
}
EOF
                fi
              fi
            done
          ' sh {} +

          echo "Gradle files after JVM fix:"
          find "$PROJECT_DIR" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Make Gradle executable
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            gradle clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-APK
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
