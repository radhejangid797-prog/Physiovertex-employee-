name: Build PhysioVertex APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p android_project
          unzip -o *.zip -d android_project

      - name: Find Gradle project
        run: |
          echo "Searching for gradlew..."
          find android_project -name gradlew -type f

      - name: Build APK
        run: |
          GRADLEW=$(find android_project -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Project directory: $PROJECT_DIR"

          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-APK
          path: android_project/**/build/outputs/apk/debug/*.apk
