name: Build PhysioVertex APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show repository files
        run: |
          echo "Repository contents:"
          find . -maxdepth 5 -type f | sort | head -500

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 6 -type f | sort | head -500

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Looking for Gradle files:"
            find extracted -type f \
              -name "*.gradle" -o -name "*.gradle.kts" \
              -print
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 4 -type f | sort

      - name: Create Gradle properties
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          touch gradle.properties

          cat >> gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          EOF

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e

          if [ ! -d "$HOME/gradle-8.7" ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip -d "$HOME"
          fi

          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

          "$HOME/gradle-8.7/bin/gradle" --version

      - name: Force Java 17 and Kotlin JVM 17
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          cat > ci.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release.set(17)
              }

              tasks.configureEach {
                  if (name.toLowerCase().contains("kotlin")) {
                      try {
                          if (hasProperty("kotlinOptions")) {
                              kotlinOptions.jvmTarget = "17"
                          }
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building:"
          pwd

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              --init-script ci.gradle \
              -Pandroid.suppressUnsupportedCompileSdk=35 \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              --init-script ci.gradle \
              -Pandroid.suppressUnsupportedCompileSdk=35 \
              assembleDebug
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."

            echo "APK search:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/ap
