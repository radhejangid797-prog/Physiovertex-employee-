name: Build PhysioVertex APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Show repository files
        run: |
          echo "Repository contents:"
          find . -maxdepth 4 -type f | sort | head -300

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 6 -type f | sort | head -500

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts"
            echo "Searching for Gradle files:"
            find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Create Gradle properties
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          touch gradle.properties

          cat >> gradle.properties <<'EOF'

          # PhysioVertex CI configuration
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          EOF

      - name: Install Gradle 8.7
        shell: bash
        run: |
          if [ ! -d "$HOME/gradle-8.7" ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip -d "$HOME"
          fi

          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Force Java and Kotlin JVM 17
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          cat > ci.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release.set(17)
              }

              tasks.configureEach {
                  if (name.toLowerCase().contains("kotlin")) {
                      try {
                          if (hasProperty("kotlinOptions")) {
                              kotlinOptions.jvmTarget = "17"
                          }
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building project in:"
          pwd

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew \
              --no-daemon \
              --stacktrace \
              -Pandroid.suppressUnsupportedCompileSdk=35 \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              --init-script ci.gradle \
              -Pandroid.suppressUnsupportedCompileSdk=35 \
              assembleDebug
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            echo "Build output:"
            find "$PROJECT_DIR" -type f | grep -E '\.apk$|build/outputs' || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-Debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Build completed
        run: |
          echo "======================================"
          echo " PhysioVertex APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK uploaded as: PhysioVertex-Debug-APK"
