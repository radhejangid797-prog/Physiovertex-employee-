name: Build PhysioVertex APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p android_project

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d android_project

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find android_project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Force JVM 17 compatibility
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Updating Java compatibility..."

          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print0 | while IFS= read -r -d '' file; do

            sed -i \
              -e 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' \
              -e 's/JavaVersion\.VERSION_8/JavaVersion.VERSION_17/g' \
              -e 's/sourceCompatibility[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/sourceCompatibility = JavaVersion.VERSION_17/g' \
              -e 's/targetCompatibility[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/targetCompatibility = JavaVersion.VERSION_17/g' \
              -e 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
              -e 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']8["'\'']/jvmTarget = "17"/g' \
              "$file" || true

          done

          echo ""
          echo "Checking Gradle files:"
          grep -RniE "sourceCompatibility|targetCompatibility|jvmTarget" \
            --include="*.gradle" \
            --include="*.gradle.kts" . || true

      - name: Create Gradle properties
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          touch gradle.properties

          if ! grep -q "org.gradle.jvmargs" gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          fi

          if ! grep -q "android.suppressUnsupportedCompileSdk" gradle.properties; then
            echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            gradle clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysioVertex-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/*.apk
          if-no-files-found: error
